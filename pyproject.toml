[project]
name = "hftengine"
version = "0.3.0"
description = "Full improved HFT market-making backtest + session metrics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "pandas>=2.0"]
[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
[project.scripts]
hftengine = "hftengine.cli:main"
[project.urls]
Source = "https://github.com/MichaelSwann2x/hftengine"
Original = "https://github.com/mirkovicdev/HFTENGINE"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/hftengine"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
